name: Setup Sesame build environment
description: Installs Node.js, npm dependencies and (optionally) GnuPG, git and pass.
inputs:
  gnupg:
    description: Install GnuPG (and pass where available)
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 22
        cache: npm
    - name: Install dependencies
      shell: bash
      run: npm ci
    - name: Install GnuPG (Linux)
      if: inputs.gnupg == 'true' && runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq gnupg pass git xvfb
    - name: Install GnuPG (macOS)
      if: inputs.gnupg == 'true' && runner.os == 'macOS'
      shell: bash
      run: brew install gnupg pass
    - name: Use the GnuPG bundled with Git for Windows
      if: inputs.gnupg == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        # Gpg4win's silent installer hangs on hosted runners (it never installs anything, and
        # `choco install gnupg` hangs too). Git for Windows, already on the runner, ships
        # GnuPG (gpg, gpgconf, gpg-agent), which is enough to exercise the same code paths.
        $bin = 'C:\Program Files\Git\usr\bin'
        foreach ($tool in 'gpg.exe', 'gpgconf.exe', 'gpg-agent.exe') {
          if (-not (Test-Path "$bin\$tool")) { throw "$tool not found in $bin" }
        }
        Add-Content $env:GITHUB_PATH $bin
    - name: Show GnuPG version
      if: inputs.gnupg == 'true'
      shell: bash
      run: gpg --version | head -n 2
