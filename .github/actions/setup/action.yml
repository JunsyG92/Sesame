name: Setup Sesame build environment
description: Installs Node.js, npm dependencies and (optionally) GnuPG, git and pass.
inputs:
  gnupg:
    description: Install GnuPG (and pass where available)
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 22
        cache: npm
    - name: Install dependencies
      shell: bash
      run: npm ci
    - name: Install GnuPG (Linux)
      if: inputs.gnupg == 'true' && runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update -qq && sudo apt-get install -y -qq gnupg pass git xvfb
    - name: Install GnuPG (macOS)
      if: inputs.gnupg == 'true' && runner.os == 'macOS'
      shell: bash
      run: brew install gnupg pass
    - name: Install native GnuPG (Windows)
      if: inputs.gnupg == 'true' && runner.os == 'Windows'
      shell: pwsh
      run: |
        # Gpg4win's installers hang on hosted runners (they copy nothing and never exit, and
        # `choco install gnupg` hangs too), and the GnuPG bundled with Git for Windows is an
        # MSYS build that does not understand Windows paths. So: fetch the Gpg4win package
        # without running it, unpack the GnuPG installer nested inside with 7-Zip, and use
        # the resulting native gpg.exe/gpgconf.exe/gpg-agent.exe directly.
        choco install gpg4win -y --no-progress --limit-output --skipscripts | Out-Null
        $outer = Get-ChildItem 'C:\ProgramData\chocolatey\lib\gpg4win\tools' -Filter 'gpg4win-*.exe' | Select-Object -First 1
        if (-not $outer) { throw 'Gpg4win package not found' }
        $seven = (Get-Command 7z).Source
        & $seven x $outer.FullName -oC:\g4w -y '$TEMP\gnupg-w32-*.exe' | Out-Null
        $inner = Get-ChildItem 'C:\g4w' -Recurse -Filter 'gnupg-w32-*.exe' | Select-Object -First 1
        if (-not $inner) { throw 'GnuPG installer not found inside Gpg4win' }
        & $seven x $inner.FullName -oC:\gnupg -y | Out-Null
        foreach ($tool in 'gpg.exe', 'gpgconf.exe', 'gpg-agent.exe') {
          if (-not (Test-Path "C:\gnupg\bin\$tool")) { throw "$tool missing from the extracted GnuPG" }
        }
        Add-Content $env:GITHUB_PATH 'C:\gnupg\bin'
    - name: Show GnuPG version
      if: inputs.gnupg == 'true'
      shell: bash
      run: gpg --version | head -n 2
