name: debug-win
on:
  push:
    branches: [debug/win-gpg]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Extract GnuPG from Gpg4win (no installation)
        shell: pwsh
        run: |
          choco install gpg4win -y --no-progress --limit-output --skipscripts | Out-Null
          $outer = Get-ChildItem 'C:\ProgramData\chocolatey\lib\gpg4win\tools' -Filter 'gpg4win-*.exe' | Select-Object -First 1
          $seven = (Get-Command 7z).Source
          & $seven x $outer.FullName -oC:\g4w -y '$TEMP\gnupg-w32-*.exe' | Select-Object -Last 2
          $inner = Get-ChildItem 'C:\g4w' -Recurse -Filter 'gnupg-w32-*.exe' | Select-Object -First 1
          "inner: $($inner.FullName) $($inner.Length)"
          & $seven x $inner.FullName -oC:\gnupg -y | Select-Object -Last 3
          "== layout"
          Get-ChildItem C:\gnupg | Select-Object -ExpandProperty Name
          Get-ChildItem C:\gnupg -Recurse -Include gpg.exe,gpgconf.exe,gpg-agent.exe,gpg-connect-agent.exe,pinentry*.exe | Select-Object -ExpandProperty FullName
      - name: Try the extracted gpg
        shell: pwsh
        run: |
          $gpg = Get-ChildItem C:\gnupg -Recurse -Filter gpg.exe | Select-Object -First 1
          if (-not $gpg) { throw 'no gpg.exe extracted' }
          $bin = $gpg.DirectoryName
          "bin: $bin"
          & $gpg.FullName --version | Select-Object -First 3
          $dir = Join-Path $env:RUNNER_TEMP 'gh'
          New-Item -ItemType Directory $dir | Out-Null
          $env:GNUPGHOME = $dir
          & $gpg.FullName --batch --pinentry-mode loopback --passphrase '' --quick-generate-key 'T <t@example.org>' future-default default never
          & $gpg.FullName --batch --list-keys
          "hello" | & $gpg.FullName --batch --yes --encrypt --recipient t@example.org --trust-model always --output "$dir\x.gpg"
          & $gpg.FullName --batch --decrypt "$dir\x.gpg"
          & "$bin\gpgconf.exe" --kill all
          "gpgconf exit: $LASTEXITCODE"
